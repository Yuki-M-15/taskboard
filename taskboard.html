<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスクボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f1;
  --white:#ffffff;
  --surface:#ffffff;
  --surface2:#f8f7f5;
  --border:#e5e3de;
  --border2:#d4d1cb;
  --text:#1a1915;
  --text2:#5a5850;
  --text3:#9a9890;
  --accent:#e8613a;
  --accent-light:#fdf0ec;
  --accent-hover:#d45530;
  --todo-col:#f0efed;
  --doing-col:#eef3fd;
  --done-col:#edf7f2;
  --pending-col:#fef8ec;
  --high:#d94f3a;
  --high-bg:#fdf0ee;
  --med:#e09020;
  --med-bg:#fef8ec;
  --low:#2e9e6a;
  --low-bg:#edf7f2;
  --radius:8px;
  --radius-sm:5px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:13px;}

/* ── Sidebar ── */
.sidebar{
  width:220px;background:var(--white);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:0;
  position:fixed;top:0;left:0;height:100vh;z-index:50;
}
.sidebar-logo{
  padding:18px 20px 14px;border-bottom:1px solid var(--border);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:600;
  color:var(--text);letter-spacing:-.3px;display:flex;align-items:center;gap:8px;
}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.sidebar-nav{padding:12px 10px;flex:1;}
.nav-section{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px 4px;}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;
  border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;
  transition:background .12s,color .12s;font-size:13px;
  border:none;background:none;width:100%;text-align:left;font-family:inherit;
}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500;}
.nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;flex-shrink:0;stroke-width:1.8;}
.nav-divider{height:1px;background:var(--border);margin:8px 10px;}

/* ── Main ── */
.main{margin-left:220px;display:flex;flex-direction:column;min-height:100vh;}

/* ── Top bar ── */
.topbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:40;
}
.topbar-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:600;color:var(--text);margin-right:4px;}
.view-tabs{display:flex;gap:2px;background:var(--surface2);border-radius:var(--radius-sm);padding:3px;}
.view-tab{
  display:flex;align-items:center;gap:5px;padding:5px 12px;
  border-radius:4px;border:none;background:none;color:var(--text2);
  font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;
  transition:all .12s;
}
.view-tab:hover{color:var(--text);}
.view-tab.active{background:var(--white);color:var(--text);box-shadow:var(--shadow);}
.view-tab svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--text3);fill:none;stroke-width:2;pointer-events:none;}
.search{padding:6px 10px 6px 28px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font-size:12px;color:var(--text);font-family:inherit;outline:none;width:200px;transition:border-color .15s,background .15s;}
.search:focus{border-color:var(--accent);background:var(--white);}
.search::placeholder{color:var(--text3);}
.filter-btns{display:flex;gap:3px;}
.filter-btn{padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s;font-weight:500;}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn-add{
  display:flex;align-items:center;gap:6px;padding:7px 14px;
  border-radius:var(--radius-sm);background:var(--accent);border:none;
  color:#fff;font-size:13px;font-family:inherit;cursor:pointer;
  font-weight:500;transition:background .12s;white-space:nowrap;
}
.btn-add:hover{background:var(--accent-hover);}
.btn-add svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.5;}

/* ── Content area ── */
.content{padding:20px 24px;flex:1;}

/* ─────────────────────────────
   KANBAN VIEW
───────────────────────────── */
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:20px;}
.col{width:256px;flex-shrink:0;}
.col-head{display:flex;align-items:center;gap:7px;padding:8px 10px;margin-bottom:8px;}
.col-dot{width:7px;height:7px;border-radius:50%;}
.col[data-id="todo"]    .col-dot{background:#8b8fcc;}
.col[data-id="doing"]   .col-dot{background:#4a7ce8;}
.col[data-id="done"]    .col-dot{background:#38a169;}
.col[data-id="pending"] .col-dot{background:#d4a017;}
.col-name{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.02em;}
.col-count{margin-left:auto;font-size:11px;color:var(--text3);background:var(--border);padding:1px 7px;border-radius:10px;font-weight:500;}
.cards{display:flex;flex-direction:column;gap:7px;min-height:48px;padding:2px 0;}
.cards.drag-over{outline:2px dashed var(--accent);outline-offset:3px;border-radius:var(--radius);}

.card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 12px;cursor:grab;transition:box-shadow .15s,border-color .15s;
  box-shadow:var(--shadow);
}
.card:hover{box-shadow:var(--shadow-md);border-color:var(--border2);}
.card.dragging{opacity:.4;cursor:grabbing;}

.card-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:7px;}
.card-title{font-size:13px;font-weight:500;line-height:1.45;flex:1;color:var(--text);}
.card-menu{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--text3);border-radius:4px;transition:color .1s,background .1s;margin-top:-1px;}
.card-menu:hover{color:var(--text2);background:var(--surface2);}
.card-menu svg{width:13px;height:13px;fill:none;stroke:currentColor;}

.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px;}
.tag{padding:1px 7px;border-radius:20px;font-size:10px;font-weight:500;background:var(--surface2);color:var(--text2);border:1px solid var(--border);}

.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.badge-prio{padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-prio.high{background:var(--high-bg);color:var(--high);}
.badge-prio.med {background:var(--med-bg);color:var(--med);}
.badge-prio.low {background:var(--low-bg);color:var(--low);}
.badge-due{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text3);}
.badge-due svg{width:11px;height:11px;stroke:currentColor;fill:none;}
.badge-due.overdue{color:var(--high);font-weight:500;}
.badge-due.soon{color:var(--med);font-weight:500;}
.sub-progress{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10px;color:var(--text3);}
.sub-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.sub-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
.add-card-btn{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:var(--radius-sm);border:1px dashed var(--border2);background:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:inherit;width:100%;text-align:left;transition:all .12s;margin-top:2px;}
.add-card-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.add-card-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;}

/* ─────────────────────────────
   LIST VIEW
───────────────────────────── */
.list-view{display:flex;flex-direction:column;gap:0;}
.list-section{margin-bottom:16px;}
.list-section-head{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:4px;
  cursor:pointer;border:none;width:100%;text-align:left;font-family:inherit;
}
.list-section-head:hover{background:var(--border);}
.list-section-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.list-section-name{font-size:12px;font-weight:600;color:var(--text2);}
.list-section-count{font-size:11px;color:var(--text3);margin-left:auto;}

.list-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--border);background:var(--white);
  cursor:pointer;transition:background .1s;
}
.list-item:first-child{border-radius:var(--radius-sm) var(--radius-sm) 0 0;}
.list-item:last-child{border-bottom:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);}
.list-item:only-child{border-radius:var(--radius-sm);}
.list-item:hover{background:var(--surface2);}
.list-check{width:15px;height:15px;border:1.5px solid var(--border2);border-radius:50%;flex-shrink:0;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.list-check.done-check{background:var(--low);border-color:var(--low);}
.list-check.done-check::after{content:'';width:7px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);}
.list-check:hover{border-color:var(--accent);}
.list-title{flex:1;font-size:13px;color:var(--text);font-weight:500;}
.list-title.done-title{text-decoration:line-through;color:var(--text3);}
.list-tags{display:flex;gap:3px;}
.list-due{font-size:11px;color:var(--text3);white-space:nowrap;}
.list-due.overdue{color:var(--high);}
.list-due.soon{color:var(--med);}
.list-prio{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.list-prio.high{background:var(--high);}
.list-prio.med{background:var(--med);}
.list-prio.low{background:var(--low);}
.list-menu{padding:2px 6px;border:none;background:none;cursor:pointer;color:var(--text3);border-radius:4px;transition:background .1s;}
.list-menu:hover{background:var(--surface2);color:var(--text2);}
.list-menu svg{width:13px;height:13px;stroke:currentColor;fill:none;display:block;}
.list-add-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;color:var(--text3);font-size:12px;cursor:pointer;border:none;background:none;font-family:inherit;transition:color .12s;}
.list-add-btn:hover{color:var(--accent);}
.list-add-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;}

.list-subtasks{padding:4px 12px 8px 37px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--border);background:var(--white);}
.list-sub-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);}
.list-sub-check{width:13px;height:13px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.list-sub-check.done{background:var(--low);border-color:var(--low);}
.list-sub-check.done::after{content:'';width:6px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);}
.list-sub-check:hover{border-color:var(--accent);}
.list-sub-text{flex:1;}
.list-sub-text.done{text-decoration:line-through;color:var(--text3);}

/* ─────────────────────────────
   CALENDAR VIEW
───────────────────────────── */
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.cal-nav{display:flex;gap:4px;}
.cal-nav-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .12s;}
.cal-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.cal-nav-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.cal-month{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:600;color:var(--text);}
.cal-today-btn{padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;font-weight:500;transition:all .12s;}
.cal-today-btn:hover{border-color:var(--accent);color:var(--accent);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.cal-day-header{background:var(--surface2);padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;}
.cal-cell{
  background:var(--white);min-height:100px;padding:6px;cursor:pointer;
  transition:background .1s;position:relative;
}
.cal-cell:hover{background:var(--accent-light);}
.cal-cell.other-month{background:var(--surface2);}
.cal-cell.other-month .cal-date{color:var(--text3);}
.cal-cell.today{background:#fff8f6;}
.cal-cell.today .cal-date{background:var(--accent);color:#fff;border-radius:50%;}
.cal-date{font-size:12px;font-weight:500;color:var(--text2);width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.cal-task-chip{
  padding:2px 6px;border-radius:4px;font-size:10px;font-weight:500;
  margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .1s;
}
.cal-task-chip:hover{opacity:.8;}
.cal-task-chip.dragging-chip{opacity:.35;}
.cal-cell.cal-drag-over{background:var(--accent-light);outline:2px dashed var(--accent);outline-offset:-2px;}
.cal-task-chip.high{background:var(--high-bg);color:var(--high);}
.cal-task-chip.med{background:var(--med-bg);color:var(--med);}
.cal-task-chip.low{background:var(--low-bg);color:var(--low);}
.cal-task-chip.todo{background:#f0efed;color:#6060a0;}
.cal-task-chip.done{background:var(--low-bg);color:var(--low);text-decoration:line-through;}
.cal-more{font-size:10px;color:var(--text3);padding:1px 4px;cursor:pointer;}
.cal-more:hover{color:var(--accent);}
.cal-add-hint{font-size:10px;color:var(--text3);opacity:0;transition:opacity .15s;padding:2px 4px;}
.cal-cell:hover .cal-add-hint{opacity:1;}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--white);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-md);transform:translateY(6px);transition:transform .2s;}
.overlay.open .modal{transform:none;}
.modal-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:600;color:var(--text);}
.modal label{font-size:11px;font-weight:500;color:var(--text3);display:block;margin-bottom:4px;letter-spacing:.03em;}
.modal input,.modal textarea,.modal select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s,background .15s;}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent);background:var(--white);}
.modal textarea{resize:vertical;min-height:60px;}
.form-row{display:flex;gap:10px;}
.form-row>div{flex:1;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.btn-cancel{padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--white);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;transition:background .12s;}
.btn-cancel:hover{background:var(--surface2);}
.btn-save{padding:7px 16px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .12s;}
.btn-save:hover{background:var(--accent-hover);}

/* subtasks in modal */
.subtask-list{display:flex;flex-direction:column;gap:5px;}
.subtask-row{display:flex;align-items:center;gap:7px;}
.subtask-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;}
.subtask-row input[type="text"]{flex:1;padding:5px 8px;font-size:12px;}
.subtask-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:2px;border-radius:3px;transition:color .1s;}
.subtask-del:hover{color:var(--high);}
.subtask-del svg{width:11px;height:11px;stroke:currentColor;fill:none;display:block;}
.btn-add-sub{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 0;transition:color .1s;}
.btn-add-sub:hover{color:var(--accent);}
.btn-add-sub svg{width:12px;height:12px;stroke:currentColor;fill:none;}

/* context menu */
.ctx-menu{position:fixed;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:4px;z-index:300;min-width:130px;box-shadow:var(--shadow-md);display:none;}
.ctx-menu.open{display:block;}
.ctx-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:4px;font-size:12px;color:var(--text2);cursor:pointer;transition:background .1s;}
.ctx-item:hover{background:var(--surface2);}
.ctx-item svg{width:12px;height:12px;stroke:currentColor;fill:none;flex-shrink:0;}
.ctx-item.danger{color:var(--high);}
.ctx-item.danger:hover{background:var(--high-bg);}

/* empty */
.empty{padding:20px 12px;text-align:center;font-size:12px;color:var(--text3);}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* hidden */
.hidden{display:none!important;}

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:500;
  background:var(--text);color:var(--white);
  padding:10px 16px;border-radius:var(--radius);
  font-size:12px;box-shadow:var(--shadow-md);
  opacity:0;transform:translateY(6px);
  transition:opacity .2s,transform .2s;
  pointer-events:none;
}
.toast.show{opacity:1;transform:none;}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo"><span class="logo-dot"></span>タスクボード</div>
  <div class="sidebar-nav">
    <div class="nav-section">メニュー</div>
    <button class="nav-item active" onclick="void(0)">
      <svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18"/></svg>マイタスク
    </button>
    <div class="nav-divider"></div>
    <div class="nav-section">優先度</div>
    <button class="nav-item" onclick="setFilter('high')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4"/></svg>高優先度
    </button>
    <button class="nav-item" onclick="setFilter('med')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/></svg>中優先度
    </button>
    <button class="nav-item" onclick="setFilter('low')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/></svg>低優先度
    </button>
    <div class="nav-divider"></div>
    <div class="nav-section">Notion連携</div>
    <button class="nav-item" id="btnNotionSync" onclick="notionSync()">
      <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
      <span id="notionSyncLabel">Notionへ同期</span>
    </button>
    <button class="nav-item" onclick="openNotionSettings()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>Notion設定

      初回「Notionへ同期」を実行すると、Notionにデータベースが自動作成されます。以降は同期のたびにNotionへタスクが書き出されます。

<script>
// ── State ──
let tasks = JSON.parse(localStorage.getItem('kb_tasks2') || 'null') || [
  {id:'t1',title:'LPバナー差し替え',note:'Slackで依頼あり。',col:'todo',prio:'high',due:'2025-05-10',tags:['LP','制作'],subs:[{text:'デザイン確認',done:false},{text:'コーディング',done:false}]},
  {id:'t2',title:'会社案内パンフ 初稿確認',note:'',col:'doing',prio:'med',due:'2025-05-14',tags:['印刷'],subs:[{text:'テキスト校正',done:true},{text:'画像差し替え',done:false}]},
  {id:'t3',title:'SNS投稿バナー（5月分）',note:'毎月定例。',col:'todo',prio:'low',due:'2025-05-20',tags:['SNS'],subs:[]},
  {id:'t4',title:'採用サイト更新',note:'',col:'pending',prio:'med',due:'',tags:['Web'],subs:[]},
  {id:'t5',title:'展示会パネル印刷手配',note:'',col:'done',prio:'high',due:'2025-04-30',tags:['印刷'],subs:[{text:'原稿確定',done:true},{text:'発注',done:true}]},
];
let currentView='kanban', filterPrio='', searchQ='', dragId=null, editId=null, ctxId=null, subtasks=[];
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();

function save(){localStorage.setItem('kb_tasks2',JSON.stringify(tasks));}
function uid(){return 't'+Date.now()+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function dueMeta(due){
  if(!due) return null;
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(due);d.setHours(0,0,0,0);
  const diff=Math.round((d-today)/(864e5));
  const label=diff<0?`${-diff}日超過`:diff===0?'今日':`残${diff}日`;
  return{diff,label};
}

function filtered(){
  let r=[...tasks];
  if(filterPrio) r=r.filter(t=>t.prio===filterPrio);
  if(searchQ){const q=searchQ.toLowerCase();r=r.filter(t=>t.title.toLowerCase().includes(q)||(t.note||'').toLowerCase().includes(q)||(t.tags||[]).some(g=>g.toLowerCase().includes(q)));}
  return r;
}

// ── View switch ──
function switchView(v){
  currentView=v;
  document.querySelectorAll('.view-tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.getElementById('view-kanban').classList.toggle('hidden',v!=='kanban');
  document.getElementById('view-list').classList.toggle('hidden',v!=='list');
  document.getElementById('view-calendar').classList.toggle('hidden',v!=='calendar');
  render();
}

// ── Render dispatcher ──
function render(){
  if(currentView==='kanban') renderKanban();
  else if(currentView==='list') renderList();
  else renderCalendar();
}

// ─────────────── KANBAN ───────────────
function renderKanban(){
  ['todo','doing','done','pending'].forEach(col=>{
    const c=document.getElementById('cards-'+col);
    const items=filtered().filter(t=>t.col===col);
    document.getElementById('count-'+col).textContent=items.length;
    c.innerHTML=items.length===0?'<div class="empty">タスクなし</div>':items.map(cardHTML).join('');
  });
  attachCardEvents();
}

function cardHTML(t){
  const done=(t.subs||[]).filter(s=>s.done).length,total=(t.subs||[]).length;
  const pct=total?Math.round(done/total*100):0;
  const dm=dueMeta(t.due);
  const dc=dm?(dm.diff<0?'overdue':dm.diff<=2?'soon':''):'';
  return `<div class="card" draggable="true" data-id="${t.id}">
    <div class="card-top"><div class="card-title">${esc(t.title)}</div>
    <button class="card-menu" data-id="${t.id}"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button></div>
    ${t.tags?.length?`<div class="card-tags">${t.tags.map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>`:''}
    <div class="card-meta">
      <span class="badge-prio ${t.prio}">${{high:'高',med:'中',low:'低'}[t.prio]}</span>
      ${dm?`<span class="badge-due ${dc}"><svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>${dm.label}</span>`:''}
    </div>
    ${total?`<div class="sub-progress"><span>${done}/${total}</span><div class="sub-bar"><div class="sub-fill" style="width:${pct}%"></div></div></div>`:''}
  </div>`;
}

function attachCardEvents(){
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart',()=>{dragId=el.dataset.id;setTimeout(()=>el.classList.add('dragging'),0);});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.cards').forEach(c=>c.classList.remove('drag-over'));});
  });
  document.querySelectorAll('.card-menu').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();ctxId=btn.dataset.id;const r=btn.getBoundingClientRect();showCtx(r.right,r.bottom+4);});
  });
}

document.querySelectorAll('.cards').forEach(zone=>{
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');if(dragId){const t=tasks.find(x=>x.id===dragId);if(t){t.col=zone.dataset.col;save();render();}}dragId=null;});
});

document.querySelectorAll('.add-card-btn').forEach(btn=>{btn.addEventListener('click',()=>openModal(null,btn.dataset.col));});

// ─────────────── LIST ───────────────
const COL_LABELS={todo:'未着手',doing:'進行中',done:'完了',pending:'ペンディング'};
const COL_IDS=['todo','doing','done','pending'];

function renderList(){
  const container=document.getElementById('view-list');
  const all=filtered();
  container.innerHTML='';
  COL_IDS.forEach(col=>{
    const items=all.filter(t=>t.col===col);
    const sec=document.createElement('div');sec.className='list-section';
    sec.innerHTML=`<div class="list-section-head">
      <span class="list-section-dot" style="background:${{todo:'#8b8fcc',doing:'#4a7ce8',done:'#38a169',pending:'#d4a017'}[col]}"></span>
      <span class="list-section-name">${COL_LABELS[col]}</span>
      <span class="list-section-count">${items.length}</span>
    </div>`;
    if(items.length){
      const ul=document.createElement('div');
      ul.innerHTML=items.map(t=>{
        const dm=dueMeta(t.due);const dc=dm?(dm.diff<0?'overdue':dm.diff<=2?'soon':''):'';
        const isDone=t.col==='done';
        const subs=t.subs||[];
        const subHTML=subs.length?`<div class="list-subtasks">${subs.map((s,si)=>`
          <div class="list-sub-row">
            <div class="list-sub-check ${s.done?'done':''}" data-id="${t.id}" data-si="${si}"></div>
            <span class="list-sub-text ${s.done?'done':''}">${esc(s.text)}</span>
          </div>`).join('')}</div>`:'';
        return `<div class="list-item" data-id="${t.id}">
          <div class="list-check ${isDone?'done-check':''}" data-id="${t.id}"></div>
          <div class="list-prio ${t.prio}"></div>
          <div class="list-title ${isDone?'done-title':''}">${esc(t.title)}</div>
          <div class="list-tags">${(t.tags||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>
          ${dm?`<div class="list-due ${dc}">${dm.label}</div>`:'<div></div>'}
          <button class="list-menu" data-id="${t.id}"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
        </div>${subHTML}`;
      }).join('');
      ul.querySelectorAll('.list-item').forEach(el=>{
        el.addEventListener('dblclick',()=>openModal(el.dataset.id));
      });
      ul.querySelectorAll('.list-check').forEach(el=>{
        el.addEventListener('click',e=>{e.stopPropagation();const t=tasks.find(x=>x.id===el.dataset.id);if(t){t.col=t.col==='done'?'todo':'done';save();render();}});
      });
      ul.querySelectorAll('.list-menu').forEach(btn=>{
        btn.addEventListener('click',e=>{e.stopPropagation();ctxId=btn.dataset.id;const r=btn.getBoundingClientRect();showCtx(r.right,r.bottom+4);});
      });
      ul.querySelectorAll('.list-sub-check').forEach(el=>{
        el.addEventListener('click',e=>{
          e.stopPropagation();
          const t=tasks.find(x=>x.id===el.dataset.id);
          if(t&&t.subs&&t.subs[+el.dataset.si]!==undefined){
            t.subs[+el.dataset.si].done=!t.subs[+el.dataset.si].done;
            save();render();
          }
        });
      });
      sec.appendChild(ul);
    }
    const addBtn=document.createElement('button');addBtn.className='list-add-btn';
    addBtn.innerHTML=`<svg viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>タスクを追加`;
    addBtn.addEventListener('click',()=>openModal(null,col));
    sec.appendChild(addBtn);
    container.appendChild(sec);
  });
}

// ─────────────── CALENDAR ───────────────
const DAYS=['日','月','火','水','木','金','土'];
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function renderCalendar(){
  document.getElementById('calMonthLabel').textContent=`${calYear}年 ${MONTHS[calMonth]}`;
  const grid=document.getElementById('calGrid');
  grid.innerHTML=DAYS.map(d=>`<div class="cal-day-header">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);

  function tasksByDate(y,m,d){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return filtered().filter(t=>t.due===ds);
  }

  // prev month
  for(let i=0;i<first;i++){
    const d=daysInPrev-first+1+i;
    grid.appendChild(makeCell(calYear,calMonth-1,d,true,tasksByDate(calYear,calMonth-1,d),today));
  }
  // current
  for(let d=1;d<=daysInMonth;d++){
    grid.appendChild(makeCell(calYear,calMonth,d,false,tasksByDate(calYear,calMonth,d),today));
  }
  // next
  const total=first+daysInMonth;const rem=(7-total%7)%7;
  for(let d=1;d<=rem;d++){
    grid.appendChild(makeCell(calYear,calMonth+1,d,true,tasksByDate(calYear,calMonth+1,d),today));
  }
}

function makeCell(y,m,d,isOther,dayTasks,today){
  const cell=document.createElement('div');
  const cellDate=new Date(y,m,d);cellDate.setHours(0,0,0,0);
  const isToday=cellDate.getTime()===today.getTime();
  cell.className='cal-cell'+(isOther?' other-month':'')+(isToday?' today':'');

  const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  cell.innerHTML=`<div class="cal-date">${d}</div>`;

  const maxShow=3;
  dayTasks.slice(0,maxShow).forEach(t=>{
    const chip=document.createElement('div');
    chip.className=`cal-task-chip ${t.col==='done'?'done':t.prio}`;
    chip.textContent=t.title;
    chip.draggable=true;
    chip.addEventListener('dragstart',e=>{
      e.stopPropagation();
      dragId=t.id;
      chip.classList.add('dragging-chip');
      e.dataTransfer.effectAllowed='move';
    });
    chip.addEventListener('dragend',()=>{
      chip.classList.remove('dragging-chip');
      document.querySelectorAll('.cal-cell').forEach(c=>c.classList.remove('cal-drag-over'));
    });
    chip.addEventListener('click',e=>{e.stopPropagation();openModal(t.id);});
    cell.appendChild(chip);
  });
  if(dayTasks.length>maxShow){
    const more=document.createElement('div');more.className='cal-more';
    more.textContent=`+${dayTasks.length-maxShow}件`;
    more.addEventListener('click',e=>{e.stopPropagation();});
    cell.appendChild(more);
  }
  const hint=document.createElement('div');hint.className='cal-add-hint';hint.textContent='+ 追加';
  cell.appendChild(hint);

  // セルへのドロップ（納期更新）
  cell.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    cell.classList.add('cal-drag-over');
  });
  cell.addEventListener('dragleave',()=>cell.classList.remove('cal-drag-over'));
  cell.addEventListener('drop',e=>{
    e.preventDefault();
    cell.classList.remove('cal-drag-over');
    if(dragId){
      const t=tasks.find(x=>x.id===dragId);
      if(t){t.due=ds;save();render();}
    }
    dragId=null;
  });

  cell.addEventListener('click',()=>openModal(null,'todo',ds));
  return cell;
}

document.getElementById('calPrev').addEventListener('click',()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();});
document.getElementById('calNext').addEventListener('click',()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();});

// ─────────────── MODAL ───────────────
function openModal(id=null,col='todo',presetDue=null){
  editId=id;subtasks=[];
  const t=id?tasks.find(x=>x.id===id):null;
  document.getElementById('modalTitle').textContent=id?'タスクを編集':'タスクを追加';
  document.getElementById('fTitle').value=t?t.title:'';
  document.getElementById('fNote').value=t?t.note||'':'';
  document.getElementById('fPrio').value=t?t.prio:'med';
  document.getElementById('fDue').value=t?t.due||'':presetDue||'';
  document.getElementById('fTags').value=t?(t.tags||[]).join(', '):'';
  document.getElementById('fCol').value=t?t.col:col;
  subtasks=t?(t.subs||[]).map(s=>({...s})):[];
  renderSubtasks();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('fTitle').focus(),50);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
document.getElementById('btnCancel').addEventListener('click',closeModal);
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});
document.getElementById('btnNewTask').addEventListener('click',()=>openModal());

document.getElementById('btnSave').addEventListener('click',()=>{
  const title=document.getElementById('fTitle').value.trim();
  if(!title){document.getElementById('fTitle').focus();return;}
  const tags=document.getElementById('fTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const data={title,note:document.getElementById('fNote').value,prio:document.getElementById('fPrio').value,due:document.getElementById('fDue').value,tags,col:document.getElementById('fCol').value,subs:[...subtasks]};
  if(editId){Object.assign(tasks.find(x=>x.id===editId),data);}
  else{tasks.push({id:uid(),...data});}
  save();render();closeModal();
});

function renderSubtasks(){
  const list=document.getElementById('subtaskList');
  list.innerHTML=subtasks.map((s,i)=>`<div class="subtask-row">
    <input type="checkbox" ${s.done?'checked':''} data-si="${i}">
    <input type="text" value="${esc(s.text)}" data-si="${i}" placeholder="サブタスク名">
    <button class="subtask-del" data-si="${i}" type="button"><svg viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>`).join('');
  list.querySelectorAll('input[type="checkbox"]').forEach(cb=>{cb.addEventListener('change',()=>{subtasks[+cb.dataset.si].done=cb.checked;});});
  list.querySelectorAll('input[type="text"]').forEach(inp=>{inp.addEventListener('input',()=>{subtasks[+inp.dataset.si].text=inp.value;});});
  list.querySelectorAll('.subtask-del').forEach(btn=>{btn.addEventListener('click',()=>{subtasks.splice(+btn.dataset.si,1);renderSubtasks();});});
}
document.getElementById('btnAddSub').addEventListener('click',()=>{
  subtasks.push({text:'',done:false});renderSubtasks();
  const inputs=document.getElementById('subtaskList').querySelectorAll('input[type="text"]');
  inputs[inputs.length-1]?.focus();
});

// ─────────────── EXPORT / IMPORT ───────────────
function exportJSON(){
  const now=new Date();
  const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`taskboard_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('書き出し完了しました');
}

function importJSON(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error();
      if(!confirm(`${data.length}件のタスクを読み込みます。現在のデータは上書きされます。続けますか？`)){
        e.target.value='';return;
      }
      tasks=data;
      save();render();
      showToast(`${data.length}件を読み込みました`);
    }catch{
      alert('ファイルの形式が正しくありません。');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}



// ─────────────── NOTION 連携 ───────────────

// ステータス・優先度のマッピング
const COL_TO_NOTION = {todo:'未着手', doing:'進行中', done:'完了', pending:'ペンディング'};
const NOTION_TO_COL = {'未着手':'todo','進行中':'doing','完了':'done','ペンディング':'pending'};
const PRIO_TO_NOTION = {high:'高', med:'中', low:'低'};

function getNotionCreds(){
  return{
    apiKey: localStorage.getItem('notion_api_key')||'',
    dbId:   localStorage.getItem('notion_db_id')||'',
  };
}

function openNotionSettings(){
  const {apiKey,dbId}=getNotionCreds();
  document.getElementById('nApiKey').value=apiKey;
  document.getElementById('nDbId').value=dbId;
  document.getElementById('notionOverlay').classList.add('open');
}
function closeNotionSettings(){
  document.getElementById('notionOverlay').classList.remove('open');
}
function saveNotionSettings(){
  const key=document.getElementById('nApiKey').value.trim();
  const db=document.getElementById('nDbId').value.trim().replace(/-/g,'');
  if(!key||!db){alert('APIキーとデータベースIDを入力してください。');return;}
  localStorage.setItem('notion_api_key',key);
  localStorage.setItem('notion_db_id',db);
  closeNotionSettings();
  showToast('Notion設定を保存しました');
}

// Notion API呼び出し（CORSプロキシ経由）
async function notionFetch(path, method='GET', body=null){
  const {apiKey}=getNotionCreds();
  // notion.so公式のCORSプロキシを使用
  const BASE='https://notion-proxy.notion.workers.dev';
  const opts={
    method,
    headers:{
      'Authorization':`Bearer ${apiKey}`,
      'Notion-Version':'2022-06-28',
      'Content-Type':'application/json',
    },
  };
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch(BASE+path,opts);
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    throw new Error(err.message||`HTTP ${res.status}`);
  }
  return res.json();
}

// データベース存在確認 → なければ作成
async function ensureDatabase(){
  const {dbId}=getNotionCreds();
  try{
    await notionFetch(`/v1/databases/${dbId}`);
    return dbId; // 存在する
  }catch(e){
    if(e.message.includes('404')||e.message.includes('Could not find')){
      return await createDatabase();
    }
    throw e;
  }
}

// Notionにデータベースを新規作成
async function createDatabase(){
  const {dbId}=getNotionCreds();
  // dbIdをページIDとして親ページにDBを作成
  const res=await notionFetch('/v1/databases','POST',{
    parent:{type:'page_id', page_id:dbId},
    title:[{type:'text',text:{content:'タスク管理'}}],
    properties:{
      'タスク名':    {title:{}},
      'ステータス':  {select:{options:[
        {name:'未着手', color:'gray'},
        {name:'進行中', color:'blue'},
        {name:'完了',   color:'green'},
        {name:'ペンディング',color:'yellow'},
      ]}},
      '優先度':      {select:{options:[
        {name:'高', color:'red'},
        {name:'中', color:'yellow'},
        {name:'低', color:'green'},
      ]}},
      '納期':        {date:{}},
      'タグ':        {multi_select:{}},
      'メモ':        {rich_text:{}},
      'ローカルID':  {rich_text:{}},
    },
  });
  localStorage.setItem('notion_db_id', res.id.replace(/-/g,''));
  showToast('Notionにデータベースを作成しました');
  return res.id;
}

// タスク1件をNotionページとして作成
async function createNotionPage(task, dbId){
  const props={
    'タスク名':   {title:[{text:{content:task.title}}]},
    'ステータス': {select:{name:COL_TO_NOTION[task.col]||'未着手'}},
    '優先度':     {select:{name:PRIO_TO_NOTION[task.prio]||'中'}},
    'メモ':       {rich_text:[{text:{content:task.note||''}}]},
    'ローカルID': {rich_text:[{text:{content:task.id}}]},
  };
  if(task.due) props['納期']={date:{start:task.due}};
  if(task.tags?.length) props['タグ']={multi_select:task.tags.map(t=>({name:t}))};
  await notionFetch('/v1/pages','POST',{
    parent:{database_id:dbId},
    properties:props,
  });
}

// タスク1件をNotionページとして更新
async function updateNotionPage(notionPageId, task){
  const props={
    'タスク名':   {title:[{text:{content:task.title}}]},
    'ステータス': {select:{name:COL_TO_NOTION[task.col]||'未着手'}},
    '優先度':     {select:{name:PRIO_TO_NOTION[task.prio]||'中'}},
    'メモ':       {rich_text:[{text:{content:task.note||''}}]},
  };
  if(task.due) props['納期']={date:{start:task.due}};
  else props['納期']={date:null};
  if(task.tags?.length) props['タグ']={multi_select:task.tags.map(t=>({name:t}))};
  else props['タグ']={multi_select:[]};
  await notionFetch(`/v1/pages/${notionPageId}`,'PATCH',{properties:props});
}

// Notionの既存ページ一覧取得（ローカルIDをキーにマップ）
async function fetchNotionPageMap(dbId){
  const map={};
  let cursor=undefined;
  while(true){
    const body={page_size:100};
    if(cursor) body.start_cursor=cursor;
    const res=await notionFetch(`/v1/databases/${dbId}/query`,'POST',body);
    for(const page of res.results){
      const localId=page.properties['ローカルID']?.rich_text?.[0]?.plain_text;
      if(localId) map[localId]=page.id;
    }
    if(!res.has_more) break;
    cursor=res.next_cursor;
  }
  return map;
}

// メイン同期処理
async function notionSync(){
  const {apiKey,dbId}=getNotionCreds();
  if(!apiKey||!dbId){
    openNotionSettings();
    return;
  }
  const label=document.getElementById('notionSyncLabel');
  const btn=document.getElementById('btnNotionSync');
  label.textContent='同期中...';
  btn.disabled=true;

  try{
    // DB確認・作成
    const resolvedDbId=await ensureDatabase();

    // 既存Notionページ取得
    const pageMap=await fetchNotionPageMap(resolvedDbId);

    // 各タスクを作成 or 更新
    let created=0, updated=0;
    for(const task of tasks){
      if(pageMap[task.id]){
        await updateNotionPage(pageMap[task.id], task);
        updated++;
      }else{
        await createNotionPage(task, resolvedDbId);
        created++;
      }
    }
    showToast(`Notion同期完了：新規${created}件・更新${updated}件`);
    label.textContent='Notionへ同期';
  }catch(err){
    console.error(err);
    if(err.message.includes('Failed to fetch')||err.message.includes('NetworkError')){
      alert('接続エラー：Notion APIに接続できませんでした。\n\nAPIキーとデータベースIDを確認してください。\nまた、Notionのコネクト設定でこのインテグレーションにアクセス権が付与されているか確認してください。');
    }else{
      alert(`同期エラー：${err.message}`);
    }
    label.textContent='Notionへ同期';
  }finally{
    btn.disabled=false;
  }
}

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}
